apiVersion: apps/v1
kind: Deployment
metadata:
  name: rails-app
  namespace: rails-app
  labels:
    app.kubernetes.io/name: rails-app
    app.kubernetes.io/component: web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: rails-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rails-app
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: rails
          image: ghcr.io/YOUR_GITHUB_USERNAME/rails-app:latest
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - secretRef:
                name: rails-app-secrets
          env:
            - name: RAILS_ENV
              value: "production"
            - name: RAILS_SERVE_STATIC_FILES
              value: "true"
            - name: BINDING
              value: "0.0.0.0"
          livenessProbe:
            httpGet:
              path: /up
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /up
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
      terminationGracePeriodSeconds: 30
