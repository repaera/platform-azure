# OPTION A (Recommended): Use Doppler + External Secrets Operator
# This keeps secrets out of git and auto-syncs from https://dashboard.doppler.com
#
# Prerequisites:
#   - Doppler operator installed by install-manifests.sh (default)
#   - Doppler service token configured: see manifests/doppler/
#   - ClusterSecretStore applied: kubectl apply -f manifests/doppler/cluster-secret-store.yaml
#
# To use Doppler, copy manifests/doppler/external-secret-example.yaml into your app's
# manifests/ directory and apply it instead of this file.

# OPTION B (Manual): Create secrets directly in Kubernetes
# Use this if you skipped Doppler (--skip-doppler) or prefer manual secret management.
# WARNING: Never commit real values. Apply this file with values injected at deploy time.

apiVersion: v1
kind: Secret
metadata:
  name: rails-app-secrets
  namespace: rails-app
type: Opaque
stringData:
  # Your PostgreSQL connection string from managed provider (Upstash, DO, Azure, etc.)
  # Example: postgresql://user:pass@host:5432/dbname?sslmode=require
  DATABASE_URL: "CHANGE_ME"

  # Rails master key (from config/master.key — never commit this file)
  RAILS_MASTER_KEY: "CHANGE_ME"

  # SECRET_KEY_BASE is derived from master key in Rails 8
  # Set explicitly only if not using credentials:
  # SECRET_KEY_BASE: "CHANGE_ME"

  # Solid Queue deployment mode:
  # OPTION 1 (Single container): Set SOLID_QUEUE_IN_PUMA=true
  #   Web server + background jobs run in one pod
  #   Good for: Getting started, low job volume
  #
  # OPTION 2 (Separate workers): Leave SOLID_QUEUE_IN_PUMA unset or false
  #   Deploy manifests/worker-deployment.yaml for separate worker pods
  #   Good for: High job volume, independent scaling
  #
  # SOLID_QUEUE_IN_PUMA: "true"

  # Optional: override log level
  # RAILS_LOG_LEVEL: "info"
