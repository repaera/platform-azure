# Example: Doppler-powered ExternalSecret for a Rails 8 app
# Prerequisites:
#   1. Doppler operator installed (install-manifests.sh default)
#   2. kubectl create secret generic doppler-token-secret \
#        --namespace doppler-operator-system \
#        --from-literal=serviceToken=dp.st.YOUR_TOKEN_HERE
#   3. kubectl apply -f cluster-secret-store.yaml
#
# This replaces manual secret.yaml. Your Doppler project "config"
# maps to a Kubernetes Secret in your app's namespace.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rails-app-secrets
  namespace: rails-app
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-secret-store
  target:
    name: rails-app-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: production
---
